<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso Administrador</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="access-screen"> <div class="access-box"> <h1>Modo Administrador</h1> <p>Panel financiero y gerencial completo</p> {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div> {% endfor %}
        {% endwith %}
        <form method="POST" style="text-align:left;"> <label>Email</label> <input type="email" name="email" required autofocus> <label>Contraseña</label> <input type="password" name="password" required> <button type="submit" class="btn" style="width:100%">Ingresar</button> </form> <p style="margin-top:20px; text-align:center;"><a href="{{ url_for('acceso') }}" style="color:var(--celeste); font-weight:600;">&larr; Volver</a></p> <p style="font-size:0.75rem; color:var(--texto-suave); text-align:center;">Demo: admin@pyme.com / admin123</p> </div>
</div>
</body>
</html>
